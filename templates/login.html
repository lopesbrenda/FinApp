{% extends "index.html" %}
{% block content %}
<div class="card card--auth">
  <h1 data-i18n="login.title">🔐 Login</h1>
  <p data-i18n="login.subtitle">Sign in to your FinLife account</p>
  
  <form id="login-form" class="form" novalidate>
    <label for="login-email" class="sr-only" data-i18n="login.email.label">Email</label>
    <input 
      id="login-email" 
      type="email" 
      data-i18n="login.email.placeholder" 
      placeholder="Email" 
      autocomplete="email" 
      required 
      aria-required="true"
    >
    
    <div class="password-wrapper">
      <label for="login-password" class="sr-only" data-i18n="login.password.label">Senha</label>
      <input 
        id="login-password" 
        type="password" 
        data-i18n="login.password.placeholder" 
        placeholder="Password" 
        autocomplete="current-password" 
        required 
        aria-required="true"
      >
      <button type="button" class="toggle-password" aria-label="Mostrar/ocultar senha">🙈</button>
    </div>
    
    <button type="submit" class="btn" data-i18n="login.submit">Sign In</button>
  </form>
  
  <div class="text-center">
    <button id="forgot-password-btn" type="button" class="link-text" data-i18n="login.forgot">Forgot password?</button>
  </div>
  
  <p class="text-center">
    <span data-i18n="login.noaccount">Don't have an account?</span> 
    <a href="/signup" class="link-text" data-i18n="login.signup">Sign up</a>
  </p>
</div>

<script type="module" src="/static/js/pages/auth.js"></script>
{% endblock %}
